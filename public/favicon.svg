<!-- Paint — brand mark. Mirrors <ds-logo variant="mark"> (brand/logo.component.ts). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="paint-brand" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ef2d92" />
      <stop offset="0.52" stop-color="#7c3dff" />
      <stop offset="1" stop-color="#4a12ab" />
    </linearGradient>
  </defs>

  <!-- Lime run-off -->
  <path d="M17.2 19c.7 3.4-1 5.6-1 8.9a2.4 2.4 0 0 0 4.8 0c0-3.3-1.7-5.5-1-8.9z" fill="#c2fb47" />

  <!-- One stroke, one letter -->
  <path
    d="M10.6 28.2V6.4h7.1a6.9 6.9 0 0 1 0 13.8h-7.1"
    fill="none"
    stroke="url(#paint-brand)"
    stroke-width="5.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wet dab, multiplying into the stroke -->
  <ellipse
    cx="25.1"
    cy="7"
    rx="4.2"
    ry="2.3"
    fill="#ef2d92"
    transform="rotate(-24 25.1 7)"
    style="mix-blend-mode: multiply"
  />
</svg>